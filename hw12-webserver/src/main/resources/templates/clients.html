<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Клиенты</title>
</head>
<body>
<h1>Новый клиент</h1>
<form action="/clients" method="post">
    <label>
        Имя<br/>
        <input type="text" name="name" required>
    </label>
    <br/><br/>
    <label>
        Улица<br/>
        <input type="text" name="street">
    </label>
    <br/><br/>
    <label>
        Телефоны (через запятую)<br/>
        <input type="text" name="numbers" placeholder="11-111, 22-222">
    </label>
    <br/><br/>
    <button type="submit">Создать клиента</button>
</form>

<h2>Список клиентов</h2>
<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>Id</th>
        <th>Имя</th>
        <th>Улица</th>
        <th>Телефоны</th>
    </tr>
    </thead>
    <tbody>
    <#list clients as client>
    <tr>
        <td>${client.id}</td>
        <td>${client.name!""}</td>
        <td>${client.street!""}</td>
        <td>${client.numbers!""}</td>
    </tr>
    </#list>
    </tbody>
</table>
</body>
</html>
