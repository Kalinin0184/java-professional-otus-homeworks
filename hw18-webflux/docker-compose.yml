services:
  postgres:
    image: postgres:15
    container_name: otus-hw18-postgres
    environment:
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd
      POSTGRES_DB: hw18db
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usr -d hw18db"]
      interval: 5s
      timeout: 5s
      retries: 10
